# dsh-skill-panel bundle patch
#
# Mounts the loader row for this plugin. The host half (lib/index.js) serves
# read-only JSON over local HTTP routes (/__dsh-skill-panel/*): it enumerates
# ALL six skill-root kinds the filesystem provider knows about
# (project-dsh / project-agents / custom / user-dsh / user-agents / bundled),
# parses each entry's YAML frontmatter and reports why the runtime would drop
# one (dropped:no-frontmatter | dropped:unclosed | dropped:bad-yaml |
# dropped:missing-fields) instead of hiding it. The only write route is a
# single entry-file rename (SKILL.md -> SKILL.md.disabled) and it is refused
# for project-level roots.
#
# The client half (lib/client.js, declared via dsh.client) registers TWO
# official slot seats through the framework `slots` service — the same
# extension point the shipped Plugins and Schedule pages use:
#   1. an icon row in the sidebar shell's root-scoped `sidebar.panellist` LIST
#      (the application-level nav row) with order 5, i.e. strictly between the
#      shipped Plugins row (0) and the shipped Schedule row (10);
#   2. the whole page in the layout's root-scoped `main` KEYED slot under the
#      same id.
# It therefore declares NO @deepseek-ai/dsh* peer dependency at all (it never
# imports one; `slots` arrives as a runtime service via ctx.inject).
#
# Mount into a profile either by adding "dsh-skill-panel" to the profile's
# `dsh.profile.bundles` list, or by inserting the same row through a user
# patch layer:
#
#   - insert:
#       - id: skill-panel
#         name: 'dsh-skill-panel'
#
# The `name` is the npm package itself; the loader resolves it from the
# profile's node_modules (installed via the profile's own package manager).

- insert:
    - id: skill-panel
      name: 'dsh-skill-cockpit'
